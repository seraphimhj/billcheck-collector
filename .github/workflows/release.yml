name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Unit tests
        run: python3 -m unittest

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.CCR_REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.CCR_REGISTRY }}/${{ secrets.CCR_NAMESPACE }}/billcheck-collector:${{ github.ref_name }}
            ${{ secrets.CCR_REGISTRY }}/${{ secrets.CCR_NAMESPACE }}/billcheck-collector:latest
